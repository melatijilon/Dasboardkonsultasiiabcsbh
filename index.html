<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Persediaan Coach IAB Sabah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-slate-800">Jabatan Konsultasi IAB Sabah</h1>
      <p class="text-xs text-slate-500 mt-1">Sistem Pengurusan Dokumentasi Kursus Persediaan Coach</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mel Berdaftar</label>
        <input type="email" id="userEmail" placeholder="contoh: peserta@moe-dl.edu.my" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button onclick="handleLogin()" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
        Log Masuk
      </button>
      <div id="msg" class="text-xs text-center p-2 rounded hidden"></div>
    </div>

    <div class="mt-6 border-t pt-4 text-xs text-slate-400 text-center">
      Peserta Bimbingan, Pensyarah Pembimbing, dan Pentadbir menggunakan e-mel berdaftar untuk pengesahan akses.
    </div>
  </div>

  <script>
    // MASUKKAN MAKLUMAT PROJEK SUPABASE ANDA DI SINI
    const SUPABASE_URL = "https://PROJECT_ID.supabase.co"; // Gantikan PROJECT_ID anda
    const SUPABASE_ANON_KEY = "PUBLIC_ANON_KEY";           // Gantikan PUBLIC_ANON_KEY anda

    let client;
    try {
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.error("Gagal initialize Supabase:", e);
    }

    async function handleLogin() {
      const emailInput = document.getElementById('userEmail');
      const email = emailInput.value.trim().toLowerCase();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('loginBtn');

      if (!email) {
        showError("Sila masukkan e-mel anda.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Memeriksa akaun...";
      msg.classList.add('hidden');

      try {
        if (!client) {
          throw new Error("Kunci SUPABASE_URL atau SUPABASE_ANON_KEY belum digantikan.");
        }

        const { data, error } = await client
          .from('profiles')
          .select('*')
          .eq('email', email)
          .maybeSingle();

        if (error) {
          throw error;
        }

        if (!data) {
          showError("E-mel tidak dijumpai. Sila pastikan e-mel telah dimasukkan ke jadual 'profiles' di Supabase.");
          resetBtn();
          return;
        }

        // Simpan maklumat sesi
        localStorage.setItem('iab_user', JSON.stringify(data));

        // Halakan mengikut peranan
        if (data.role === 'participant') {
          window.location.href = 'participant/dashboard.html';
        } else if (data.role === 'coach_lecturer') {
          window.location.href = 'lecturer/dashboard.html';
        } else if (data.role === 'admin') {
          window.location.href = 'admin/dashboard.html';
        } else {
          showError("Peranan pengguna (" + data.role + ") tidak sah.");
          resetBtn();
        }

      } catch (err) {
        showError("Ralat Sistem: " + (err.message || err));
        resetBtn();
      }
    }

    function showError(text) {
      const msg = document.getElementById('msg');
      msg.innerText = text;
      msg.className = "text-xs text-center p-2 rounded bg-red-100 text-red-700 block";
    }

    function resetBtn() {
      const btn = document.getElementById('loginBtn');
      btn.disabled = false;
      btn.innerText = "Log Masuk";
    }
  </script>
</body>
</html>
